services:
  backend:
    build:
      context: ./sahimpact-backend
      dockerfile: Dockerfile
    container_name: sahimpact_backend
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/sahimpact.db
    volumes:
      - sahimpact_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./sahimpact-frontend
      dockerfile: Dockerfile
    container_name: sahimpact_frontend
    ports:
      - "9090:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sahimpact_data: {}
