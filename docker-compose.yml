services:
  backend:
    build:
      context: ./sahimpact-backend
      dockerfile: Dockerfile
    container_name: partnersystem_backend
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/partnersystem.db
    volumes:
      - partnersystem_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./sahimpact-frontend
      dockerfile: Dockerfile
    container_name: partnersystem_frontend
    ports:
      - "9090:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  partnersystem_data: {}
